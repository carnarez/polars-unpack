name: Run Python tests

on:
  push:
    path:
      - '**.py'

jobs:
  Test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout https://github.com/carnarez/polars-unpack repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --root-user-action=ignore --upgrade pip uv
          python -m uv pip install --no-cache-dir --system polars pytest pytest-cov

      - name: Run pytest
        run: |
          python -m pytest --color=yes --cov=unpack --cov-report term-missing --verbose
